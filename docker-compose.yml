version: "3"
services:
  jekyll:
    image: amirpourmand/al-folio
    container_name: al-folio-website
    # We removed 'rm -f Gemfile.lock' so the gems stay installed
    command: >
      bash -c "bundle install && 
               bundle exec jekyll serve --watch --port=8080 --host=0.0.0.0 --livereload"
    ports:
      - 8080:8080
    volumes:
      - .:/srv/jekyll